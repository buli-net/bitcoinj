name: Build bitcoinj 0.17.1 JAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Git checkout
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          
      - name: Build JAR, skip test + protobuf
        run: gradle :core:jar -x test -x generateProto --no-daemon --stacktrace
        
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: bitcoinj-core-0.17.1
          path: core/build/libs/bitcoinj-core-*.jar
