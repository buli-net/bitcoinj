name: Build bitcoinj 0.17.1 JAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Git checkout
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          
      - name: Build all modules JAR
        run: |
          cat > build.gradle.kts << 'EOF'
          plugins {
            id("com.github.johnrengelman.shadow") version "8.1.1"
          }
          dependencies {
            implementation(project(":bitcoinj-core"))
            implementation(project(":bitcoinj-wallet"))
            implementation(project(":bitcoinj-base"))
            implementation(project(":bitcoinj-protobuf"))
          }
          tasks.shadowJar {
            archiveClassifier.set("all")
            mergeServiceFiles()
          }
          EOF
          gradle shadowJar -x test --no-daemon --stacktrace
          
      - name: List built files
        run: find . -name "*-all.jar"
        
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: bitcoinj-all-0.17.1
          path: build/libs/*-all.jar
