name: Build bitcoinj modules

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Git checkout
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          
      - name: Build all bitcoinj modules
        run: gradle :bitcoinj-core:jar :bitcoinj-base:jar :bitcoinj-wallet:jar :bitcoinj-protobuf:jar -x test --no-daemon
        
      - name: Collect JARs
        run: |
          mkdir bitcoinj-jars
          find . -path "*/build/libs/*.jar" ! -name "*-plain.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" -exec cp {} bitcoinj-jars/ \;
          ls -lh bitcoinj-jars/
        
      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: bitcoinj-modules
          path: bitcoinj-jars/*.jar
